name: Deploy Kazepost to Azure

on:
  push:
    branches: [ "main" ] # Robot ini akan jalan tiap kali kamu push ke main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repo GitHub kamu
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      # 2. Login ke akun Azure kamu pakai JSON AZURE_CREDENTIALS tadi
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login ke Container Registry (Gudang Image) kamu
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 4. Build Docker Image (Bungkus Laravelnya)
      # Kita pakai Dockerfile standar PHP 8.3-fpm
      - name: Build and Push Docker Image
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/kazepos-app:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/kazepos-app:${{ github.sha }}

      # 5. Perintahkan Azure Web App buat pakai Image terbaru tadi
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kazeposapp' # <--- GANTI INI dengan nama Web App kamu di Azure
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/kazepos-app:${{ github.sha }}'
